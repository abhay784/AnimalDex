name: AnimalDex
options:
  bundleIdPrefix: com.abhay
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  xcodeVersion: "1640"

configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  AnimalDex:
    type: application
    platform: iOS
    sources:
      - path: AnimalDex
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        INFOPLIST_FILE: AnimalDex/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"

  AnimalDexTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AnimalDexTests
    dependencies:
      - target: AnimalDex
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.abhay.animaldex.tests
        GENERATE_INFOPLIST_FILE: YES

  AnimalDexUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - AnimalDexUITests
    dependencies:
      - target: AnimalDex
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.abhay.animaldex.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: AnimalDex

schemes:
  AnimalDex:
    build:
      targets:
        AnimalDex: all
        AnimalDexTests: [test]
        AnimalDexUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AnimalDexTests
        - AnimalDexUITests
